<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ring" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Circular Badge -->
  <circle cx="256" cy="256" r="248" fill="#05080c" stroke="#1e293b" stroke-width="3"/>

  <!-- Oxygen Flow Ring -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#ring)" stroke-width="28" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Solid Crisp White YU Letters -->
  <g fill="#ffffff" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <!-- Centered bold YU -->
    <text x="248" y="296" font-size="168" letter-spacing="-4" fill="#ffffff">YU</text>
  </g>

  <!-- Electric Cyan O2 Subscript -->
  <g filter="url(#glow)">
    <!-- O ring -->
    <circle cx="388" cy="388" r="42" fill="none" stroke="#00e5ff" stroke-width="16"/>
    <!-- 2 subscript -->
    <text x="446" y="422" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="56" font-weight="900" fill="#00e5ff">2</text>
  </g>
</svg>